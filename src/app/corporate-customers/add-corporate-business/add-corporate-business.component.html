<div class="container-fluid p-4 dashboard-container">
  <!-- Top Header -->
  <div class="row mb-4 align-items-center">
    <div class="col-md-6">
      <h2 class="fw-bold mb-1">Add New Business</h2>
      <p class="text-muted small">Add a new corporate business to the system</p>
    </div>
    <div class="col-md-6">
      <div class="input-group search-group ms-auto" style="max-width: 400px;">
        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
        <input type="text" class="form-control border-start-0 ps-0 text-muted" placeholder="Search...">
      </div>
    </div>
  </div>

  <!-- Breadcrumb/Back Section -->
  <div class="card border-0 shadow-sm mb-4 px-3 py-4">
    <div class="row align-items-center">
      <div class="col-auto">
        <button class="btn btn-light rounded-circle back-btn" [routerLink]="['/corporate-customers']">
          <i class="bi bi-arrow-left"></i>
        </button>
      </div>
      <div class="col px-0">
        <h4 class="fw-bold mb-0">Add New Business</h4>
        <p class="text-muted small mb-0">Search for CIF and select accounts to create business</p>
      </div>
    </div>
  </div>

  <!-- CIF Search Card -->
  <div class="card border-0 shadow-sm p-4">
    <h5 class="fw-bold mb-4">CIF Search</h5>
    <div class="mb-2">
      <label for="cifNumber" class="form-label fw-bold small text-muted">CIF Number</label>
      <div class="row g-3">
        <div class="col">
          <input 
            type="text" 
            class="form-control py-2 px-3 cif-input" 
            id="cifNumber" 
            placeholder="Enter CIF (e.g., 123231)"
            [(ngModel)]="cifNumber"
          >
        </div>
        <div class="col-auto">
          <button class="btn btn-primary px-4 py-2 search-btn d-flex align-items-center gap-2" (click)='onSearch()'>
            <i class="bi bi-search"></i> Search
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
